<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Practicum E-Logbook | Logbook Entry
    </title>


    <!-- Global CSS -->
    <link
        rel="stylesheet"
        href="assets/css/style.css"
    >


    <!-- Logbook CSS -->
    <link
        rel="stylesheet"
        href="assets/css/logbook.css"
    >

</head>


<body>


    <!-- =====================================
         HEADER
    ====================================== -->

    <header class="site-header">

        <div class="navbar container">

            <a
                href="index.html"
                class="brand"
            >
                Tammie's Practicum E-Logbook
            </a>


            <nav class="nav-menu">

                <a
                    href="index.html"
                    class="nav-link"
                >
                    About Me
                </a>


                <a
                    href="logbook.html"
                    class="nav-link active"
                >
                    Logbook Entry
                </a>

            </nav>

        </div>

    </header>



    <!-- =====================================
         MOBILE DRAWER BUTTON
    ====================================== -->

    <button
        class="week-drawer-toggle"
        id="weekDrawerToggle"
        type="button"
    >
        ☰
        <span>Browse Logbook</span>
    </button>


    <div
        class="week-drawer-overlay"
        id="weekDrawerOverlay"
    ></div>



    <!-- =====================================
         LOGBOOK APP

         If your official Week 1 starts
         10 August 2026, keep this date.

         If Week 1 should start 27 July,
         change it to 2026-07-27.
    ====================================== -->

    <main
        class="week-logbook container"
        id="logbookApp"
        data-practicum-start="2026-09-21"
    >


        <!-- =================================
             LEFT SIDEBAR
        ================================== -->

        <aside
            class="week-sidebar"
            id="weekSidebar"
        >


            <div class="week-sidebar-heading">

                <div>

                    <p class="section-label">
                        A261 PRACTICUM
                    </p>

                    <h2>
                        Logbook
                    </h2>

                </div>


                <button
                    class="week-drawer-close"
                    id="weekDrawerClose"
                    type="button"
                >
                    ×
                </button>

            </div>



            <!-- VIEW SWITCH -->

            <div class="logbook-view-switch">

                <button
                    class="logbook-view-button"
                    id="calendarViewButton"
                    type="button"
                >
                    Calendar
                </button>


                <button
                    class="logbook-view-button active"
                    id="timelineViewButton"
                    type="button"
                >
                    Timeline
                </button>

            </div>



            <!-- =================================
                 CALENDAR
            ================================== -->

            <div
                class="logbook-side-panel"
                id="calendarPanel"
                hidden
            >

                <div class="mini-calendar-header">

                    <button
                        id="previousMonth"
                        type="button"
                    >
                        ‹
                    </button>


                    <h3 id="calendarMonthTitle">
                        Month
                    </h3>


                    <button
                        id="nextMonth"
                        type="button"
                    >
                        ›
                    </button>

                </div>


                <div class="mini-calendar-weekdays">

                    <span>Mon</span>
                    <span>Tue</span>
                    <span>Wed</span>
                    <span>Thu</span>
                    <span>Fri</span>
                    <span>Sat</span>
                    <span>Sun</span>

                </div>


                <div
                    class="mini-calendar-grid"
                    id="calendarGrid"
                ></div>

            </div>



            <!-- =================================
                 TIMELINE
            ================================== -->

            <div
                class="logbook-side-panel"
                id="timelinePanel"
            >

                <div
                    class="week-timeline"
                    id="weekTimeline"
                >

                    <p class="logbook-loading">
                        Loading logbook...
                    </p>

                </div>

            </div>


        </aside>



        <!-- =================================
             RIGHT CONTENT
        ================================== -->

        <section class="week-content">


            <header class="week-content-heading">

                <div>

                    <p class="section-label">
                        LOGBOOK ENTRY
                    </p>


                    <h1 id="weekTitle">
                        Week
                    </h1>


                    <p id="weekDateRange">
                        Select a week to view logbook entries.
                    </p>

                </div>


                <div
                    class="week-number-badge"
                    id="weekNumberBadge"
                >
                    Week
                </div>

            </header>



            <!-- Monday - Friday inserted here -->

            <div
                class="week-entry-list"
                id="weekEntryList"
            ></div>


        </section>


    </main>



    <!-- =====================================
         FOOTER
    ====================================== -->

    <footer class="site-footer">

        <div class="container">

            <p>
                Practicum E-Logbook
                <span id="currentYear"></span>
            </p>

            <p class="footer-note">
                For practicum documentation and academic review.
            </p>

        </div>

    </footer>



    <script src="assets/js/app.js"></script>
    <script src="assets/js/logbook.js"></script>


</body>

</html>
